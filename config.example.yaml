# ============================================================
# 软著登记自动化智能体 - YAML 配置文件示例（v2 对齐平台真实字段）
# 基于：中国版权保护中心 R11软件著作权登记申请 平台PDF截图
# ============================================================

# ---- 输入/输出 ----
source_code_dir: "./source_code"
manual_path: "./manual.docx"
output_dir: "./output"

# ============================================================
# Step 1: 软件申请信息
# ============================================================
software:
  full_name: "智能管理系统"                 # *软件全称
  short_name: "智能管理"                   # 可选
  version: "V1.0"                         # *版本号 (Vx.x)
  category_code: "B01"                    # GB/T13702 分类号（可选）
  develop_date: "2025-01-15"              # *开发完成日期 YYYY-MM-DD
  publish_status: "unpublished"           # published / unpublished
  publish_date: ""                        # 已发表时必填，且 ≥ develop_date
  publish_location: ""                    # 已发表时填
  development_type: "independent"         # independent / cooperative / commissioned / task
  software_type: "original"               # original(原创) / modified(修改)
  modify_desc: ""
  original_reg_no: ""

# ============================================================
# Step 2: 软件开发信息
# 每个环境描述字段 0/50 字，按平台截图的6个独立输入框
# ============================================================
dev:
  dev_hardware_env: "开发机: x86_64, 4核CPU, 8GB内存, 256GB SSD"
  run_hardware_env: "部署环境: x86_64, 2核+CPU, 4GB+内存"
  dev_os: "Windows 10/11, macOS 12+, Ubuntu 20.04+"
  dev_environment: "Python 3.10+, VS Code, Git, pip 包管理器"
  run_platform: "Linux / macOS / Windows 跨平台运行"
  support_env: "支持 Python 运行时、数据库、Web 服务组件"
  languages: ["Python"]                   # * 平台按钮列表内的语言名
  languages_custom: ""                    # 不在平台列表的语言在此补充 (0/120)

# ============================================================
# Step 3: 软件功能与特点
# 按平台：源程序量 + 开发目的(0/50) + 面向领域(0/50)
#         + 主要功能(500~1300) + 技术特点标签 + 鉴别材料类型
# ============================================================
feature:
  source_code_lines: 0                    # * 0=自动从源程序统计
  purpose: "为企业提供高效的数据管理与业务自动化工具"  # * 0/50
  target_industry: "企业信息化、数据管理、业务流程自动化"  # * 0/50
  main_functions: |                         # * 平台要求 500-1300 字
    智能管理系统是一套面向企业级用户的综合性软件系统。系统围绕业务全流程进行设计，
    集成了用户管理、数据管理、报表统计、权限控制等核心功能模块。在用户管理方面，
    系统提供多角色权限控制体系，支持用户注册、登录认证、角色分配、权限管理。
    在数据管理方面，支持多源数据接入、统一存储、灵活查询、批量导入导出。
    在报表统计方面，内置多维度报表模板，支持实时数据统计、趋势分析、图表可视化。
    在系统管理方面，提供参数配置、操作日志审计、数据备份恢复等运维支持能力。
  tech_tags: ["大数据软件", "云计算软件", "APP"]  # * 从平台标签列表选择
  tech_desc: "采用分层架构设计，支持水平扩展，具备良好的稳定性与安全性"  # 0/100
  program_submit_type: "normal"           # normal(一般交存) / exception(例外交存)
  doc_submit_type: "normal"               # 同上

# ============================================================
# 著作权人
# ============================================================
copyright_holder:
  name: "北京某某科技有限公司"            # * 公司全称/自然人姓名
  category: "legal"                       # natural / legal / illegal
  id_type: "统一社会信用代码"
  id_number: "91110108XXXXXXXXXX"
  nationality: "中国"
  province: "北京市"
  city: "北京市"

# ============================================================
# 权利说明
# ============================================================
right:
  acquire_type: "original"                # original / transfer / inheritance / succession
  scope: "all"                            # all / partial
  partial_rights: []

# ============================================================
# 注意事项
# ============================================================
# 1. 字段右侧 * 表示平台必填
# 2. 所有环境描述字段严格遵守平台字数限制（每个 0/50）
# 3. 编程语言 languages 必须使用平台按钮显示名（如 "Assembly language" 而非 "Assembly"）
#    不在列表内的语言（如 Rust/Kotlin/CSS）请填到 languages_custom
# 4. main_functions 必须 500-1300 字，否则平台侧会提示字数不够
# 5. tech_tags 必须从平台分类列表选择：
#    APP/游戏软件/教育软件/金融软件/医疗软件/地理信息软件/云计算软件/
#    信息安全软件/大数据软件/人工智能软件/VR软件/5G软件/小程序/物联网软件/智慧城市软件
# 6. 鉴别材料上传 PDF（每页≥50行/≥30行，前30页+后30页，页眉软件名+版本号）
